[package]
name = "rust-locate"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "Locate candidate mutation sites in a Rust file. The Rust half of crucible's locator contract."
publish = false

[[bin]]
name = "rust-locate"
path = "src/main.rs"

[dependencies]
# span-locations is what makes Span::byte_range() available outside a proc
# macro. Without it every span reports 0..0 and every candidate would splice at
# the top of the file — silently, producing garbage that still parsed.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit", "parsing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
